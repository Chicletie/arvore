<!-- Servido pelo GitHub Pages pra qualquer caminho que não exista como arquivo de verdade —

     e desenha a página certa via wiki-core.js.
     Caminhos abaixo são absolutos (começando em /) de propósito: como este arquivo pode ser
     servido pra qualquer profundidade de URL (ex: /wiki/algo, /ursprung/algo), um caminho
     relativo tipo "./wiki-style.css" resolveria errado (pra dentro de /wiki/). Root-relative
     desde 2026-09-16 (domínio próprio paradisegate.com.br, sem subpasta /arvore/ — antes disso
     apontava pra /arvore/, quando o site vivia em chicletie.github.io/arvore/). -->
