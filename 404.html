<!-- Servido pelo GitHub Pages pra qualquer caminho dentro de /arvore/ que não exista como
     arquivo de verdade — é assim que /wiki/<slug> vira um link "bonito" sem precisar de
     servidor: o navegador mostra a URL /arvore/wiki/leonel-bianchi, mas quem responde é
     este arquivo, que lê esse caminho e desenha a página certa via wiki-core.js.
     Caminhos abaixo são absolutos (começando em /arvore/) de propósito: como este arquivo
     pode ser servido pra qualquer profundidade de URL (ex: /arvore/wiki/algo), um caminho
     relativo tipo "./wiki-style.css" resolveria errado (pra dentro de /arvore/wiki/). -->
<link rel="icon" href="/arvore/icon.svg?v=3" type="image/svg+xml" />
<link rel="stylesheet" href="/arvore/wiki-style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
