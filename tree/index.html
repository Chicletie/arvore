  function wbUniverseMap(v, uniId, f) {
    var w = wbState();
    var entries = wbEntriesOf(uniId);
    w.mapHide = w.mapHide || { types: {}, tags: {}, fr: {} };
    var colorBy = w.mapColorBy || "tipo";

    // "obra" here means franchise OR campaign (wbWorksOf's unification): a campanha é uma obra
    // tanto quanto um livro/franquia, então precisa aparecer tanto no agrupamento por cor quanto
    // nos chips de filtro, não só na aba Obras (franquia-only) em outro lugar.
    var typesPresent = [], tagsPresent = [];
    var frs = wbFranchisesOf(uniId).map(function (fr) { return { id: fr.id, name: fr.name || "(obra)" }; })
      .concat(wbCampaignsOf(uniId).map(function (cp) { return { id: cp.id, name: (cp.name || "(campanha)") + " 🎲" }; }));
    entries.forEach(function (e) {
      if (typesPresent.indexOf(e.type) === -1) typesPresent.push(e.type);
      (e.tags || []).forEach(function (t) { if (tagsPresent.indexOf(t) === -1) tagsPresent.push(t); });
    });

    var visible = entries.filter(function (e) {
      if (w.mapHide.types[e.type]) return false;
      var eObraIds = wbWorksOf(e).map(function (o) { return o.id; });
      if (eObraIds.length && eObraIds.every(function (id) { return w.mapHide.fr[id]; })) return false;
      return true;
    });

    // Monta nós/ligações ANTES da barra de filtro, pra ela conseguir mostrar quantas entradas
    // soltas existem e a busca poder destacar uma entrada na hora — tudo calculado uma vez só.
    var vis = {}; visible.forEach(function (e) { vis[e.id] = 1; });
    var nodes = visible.map(function (e) {
      var eObras = wbWorksOf(e);
      var col = colorBy === "franquia" ? ((eObras[0] && !w.mapHide.fr[eObras[0].id]) ? franchiseColor(eObras[0].id) : "var(--faint)") : typeColor(e.type);
      return { id: e.id, label: wbDisplayName(e), color: col, r: 19, x: e.x, y: e.y, kind: "entry", ref: e, group: colorBy === "franquia" ? ((eObras[0] && eObras[0].id) || "—") : e.type };
    });
    var edges = [], localCands = {}, portalSeen = {};
    visible.forEach(function (e) {
      (e.links || []).forEach(function (lk) {
        var target = wbEntry(lk.to);
        if (!target) return;
        if (target.universeId === uniId) {
          if (!vis[target.id]) return;
          var key = [e.id, lk.to].sort().join("|");
          var pr = labelPriority(lk.label);
          if (!localCands[key] || pr < localCands[key].priority) {
            localCands[key] = { from: e.id, to: lk.to, label: lk.label || "", style: linkStyleOf(lk.label), priority: pr };
          }
        } else {
          var pid = "portal:" + lk.to;
          if (!portalSeen[pid]) {
            nodes.push({ id: pid, label: wbDisplayName(target) + " ↗", color: flowerById(target.universeId).color, r: 14, kind: "portal", ref: target });
            portalSeen[pid] = 1;
          }
          edges.push({ from: e.id, to: pid, label: lk.label || "", style: linkStyleOf(lk.label) });
        }
      });
    });
    Object.keys(localCands).forEach(function (k) { edges.push(localCands[k]); });
    // Criar uma entrada "dentro de" outra (parentId) não gerava NENHUMA linha no mapa — a
    // relação de hierarquia ficava invisível, só aparecia no modo "árvore" da lista. Aqui ela
    // vira uma linha fraca/tracejada rotulada "contém", igual ao tratamento do link com o hub
    // do universo, só que fica clara qual entrada está dentro de qual.
    visible.forEach(function (e) {
      if (e.parentId && vis[e.parentId]) edges.push({ from: e.parentId, to: e.id, weak: true, label: "contém" });
    });

    // Entradas sem NENHUMA ligação real (nem link, nem contém, nem alvo de link de ninguém) só
    // boiam soltas no meio do gráfico sem servir de referência — escondidas por padrão pra sobrar
    // espaço/legibilidade pro que de fato se conecta. O filtro "soltas" abaixo revela de volta.
    var degree = {};
    edges.forEach(function (e) { degree[e.from] = (degree[e.from] || 0) + 1; degree[e.to] = (degree[e.to] || 0) + 1; });
    var orphanIds = nodes.filter(function (n) { return n.kind === "entry" && !degree[n.id]; }).map(function (n) { return n.id; });
    if (!w.mapShowOrphans && orphanIds.length) {
      var orphanSet = {}; orphanIds.forEach(function (id) { orphanSet[id] = 1; });
      nodes = nodes.filter(function (n) { return !orphanSet[n.id]; });
    }

    // Agrupamento visual: um "hub" fraco por tipo (ou por obra, seguindo o mesmo critério da
    // cor) puxa suavemente cada entrada pra perto das outras do mesmo grupo, com uma linha fina
    // tracejada até o rótulo do grupo — sem isso, a física pura empilha tudo num monte só, sem
    // nenhuma organização visível além da cor do próprio ponto.
    function groupLabel(gid) {
      if (colorBy !== "franquia") return gid;
      if (gid === "—") return "sem obra";
      var fr = frs.filter(function (x) { return x.id === gid; })[0];
      return fr ? fr.name : gid;
    }
    var groupsOf = {}; nodes.forEach(function (n) { if (n.kind === "entry") groupsOf[n.group] = 1; });
    var groupIds = Object.keys(groupsOf);
    var hubR = Math.min(230, 70 + groupIds.length * 20);
    var hubPos = {};
    groupIds.forEach(function (gid, i) {
      var a = -Math.PI / 2 + i * (Math.PI * 2 / groupIds.length);
      hubPos[gid] = { x: Math.cos(a) * hubR, y: Math.sin(a) * hubR };
    });
    nodes.forEach(function (n) {
      if (n.kind !== "entry") return;
      n.hub = hubPos[n.group];
      edges.push({ from: n.id, to: "cluster:" + n.group, weak: true });
    });
    groupIds.forEach(function (gid) {
      nodes.push({ id: "cluster:" + gid, label: groupLabel(gid), color: colorBy === "franquia" ? (gid === "—" ? "var(--faint)" : franchiseColor(gid)) : typeColor(gid), r: 7, kind: "hub", fixed: true, x: hubPos[gid].x, y: hubPos[gid].y });
    });
    var legendGroups = {};
    nodes.forEach(function (n) { if (n.kind === "entry") legendGroups[groupLabel(n.group)] = n.color; });

    // filter bar
    var fbar = el("div", { class: "wb-filterbar" });
    var allEntryItems = entries.map(function (e) { return { id: e.id, label: wbDisplayName(e), meta: e.type }; }).sort(function (a, b) { return a.label.localeCompare(b.label); });
    var searchCombo = wbCombo({
      items: allEntryItems, wrapClass: "grow", placeholder: "🔍 achar entrada no mapa…", emptyLabel: "(limpar destaque)",
      value: w.mapHighlight || "",
      onChange: function (id) {
        if (id && orphanIds.indexOf(id) !== -1) w.mapShowOrphans = true;
        w.mapHighlight = id || null; render();
      }
    });
    fbar.appendChild(el("div", { style: "display:flex;width:100%;margin-bottom:8px" }, [searchCombo]));
    fbar.appendChild(el("span", { class: "wb-fl", text: "cor:" }));
    fbar.appendChild(segControl([["tipo", "tipo"], ["franquia", "obra"]], colorBy, function (c) { wbGo({ mapColorBy: c }); }));
    if (typesPresent.length) {
      fbar.appendChild(el("span", { class: "wb-fl", text: "tipos:" }));
      typesPresent.forEach(function (t) {
        fbar.appendChild(el("button", { class: "chip sm", type: "button", "aria-pressed": w.mapHide.types[t] ? "false" : "true", style: "color:" + typeColor(t), onclick: function () { w.mapHide.types[t] = !w.mapHide.types[t]; render(); } }, [el("span", { class: "cdot" }), el("span", { style: "color:var(--ink)", text: t })]));
      });
    }
    if (frs.length) {
      fbar.appendChild(el("span", { class: "wb-fl", text: "obras:" }));
      frs.forEach(function (fr) {
        fbar.appendChild(el("button", { class: "chip sm", type: "button", "aria-pressed": w.mapHide.fr[fr.id] ? "false" : "true", style: "color:" + franchiseColor(fr.id), onclick: function () { w.mapHide.fr[fr.id] = !w.mapHide.fr[fr.id]; render(); } }, [el("span", { class: "cdot" }), el("span", { style: "color:var(--ink)", text: fr.name })]));
      });
    }
    if (orphanIds.length) {
      fbar.appendChild(el("span", { class: "wb-fl", text: "soltas:" }));
      fbar.appendChild(el("button", { class: "chip sm", type: "button", "aria-pressed": w.mapShowOrphans ? "true" : "false", onclick: function () { w.mapShowOrphans = !w.mapShowOrphans; render(); } }, [el("span", { class: "cdot" }), el("span", { style: "color:var(--ink)", text: (w.mapShowOrphans ? "ocultar " : "mostrar ") + orphanIds.length + (orphanIds.length > 1 ? " soltas" : " solta") })]));
    }
    // saved views
    var views2 = C().mapViews.filter(function (mv) { return mv.universeId === uniId; });
    var vrow = el("div", { class: "inline", style: "margin-top:8px;gap:6px" });
    views2.forEach(function (mv) {
      vrow.appendChild(el("button", { class: "btn ghost sm", type: "button", text: "▸ " + mv.name, onclick: function () {
        w.mapHide = clone(mv.hide || { types: {}, tags: {}, fr: {} });
        w.mapColorBy = mv.colorBy || "tipo";
        Object.keys(mv.positions || {}).forEach(function (id) { var en = wbEntry(id); if (en) { en.x = mv.positions[id].x; en.y = mv.positions[id].y; } });
        save(); render();
      } }));
    });
    vrow.appendChild(el("button", { class: "btn ghost sm", type: "button", text: "+ salvar vista", onclick: function () {
      var nm = window.prompt("Nome da vista:");
      if (!nm) return;
      var pos = {};
      wbEntriesOf(uniId).forEach(function (en) { if (en.x != null) pos[en.id] = { x: en.x, y: en.y }; });

  /* ---- Datas de eventos (precisão variável: ano · mês/ano · dia/mês/ano) ---- */
  function uniMonths(uniId) {
    var cal = C().calendars[uniId];
    return (cal && Array.isArray(cal.months) && cal.months.length) ? cal.months.map(function (m) { return m.name; }) : MONTHS;
  }
  function evSortKey(ev) {
    // stable chronological order; year-only (m=0) sorts before dated within the same year
    return ev.y * 100000 + (ev.m || 0) * 100 + (ev.d || 0);
  }
  function evDateLabel(ev, uniId) {
    var ms = uniMonths(uniId);
    var mn = ev.m != null ? (ms[ev.m - 1] || ("mês " + ev.m)) : null;
    if (ev.d != null && mn) return ev.d + " de " + mn + ", ano " + ev.y;
    if (mn) return mn + " · ano " + ev.y;
    return "ano " + ev.y;
  }
  function eraOf(uniId, y) {
    var cal = C().calendars[uniId];
    if (!cal || !Array.isArray(cal.eras)) return null;
    var best = null;
    cal.eras.forEach(function (er) {
      if (er.name && (er.fromYear || 0) <= y && (!best || er.fromYear > best.fromYear)) best = er;
    });
    return best ? best.name : null;
  }
  // every dated thing in a universe: entry events + entries that only have a plain year
  function wbTimelineItems(uniId) {
    var out = [];
    wbEntriesOf(uniId).forEach(function (e) {
      if (e.events && e.events.length) {
        e.events.forEach(function (ev) { out.push({ e: e, ev: ev, y: ev.y, key: evSortKey(ev) }); });
      } else if (e.year != null) {
        out.push({ e: e, ev: { y: e.year, m: null, d: null, label: "", implicit: true }, y: e.year, key: evSortKey({ y: e.year }) });
      }
    });
    return out.sort(function (a, b) { return a.key - b.key; });
  }

    });

    search.addEventListener("input", function () { w.tlQuery = search.value; renderTimelineList(); });
    v.appendChild(search);

    function passes(it) {

  /* ---- Propagação de eventos entre entradas ---- */
  // Cria (idempotente — nunca duplica) a cópia de um evento numa entrada-alvo. major é decidido
  // pelo chamador: cópias diretas (local/envolvidos) herdam o major/minor do evento original,
  // cópias por herança de local-mãe são SEMPRE minor, mesmo que o evento original seja major.
  function wbPropagateEventCopy(target, ev, majorFlag) {
    if (!Array.isArray(target.events)) target.events = [];
    if (target.events.some(function (x) { return x.familyId === ev.familyId; })) return;
    target.events.push({
      id: uid(), familyId: ev.familyId, originEntryId: ev.originEntryId,
      y: ev.y, m: ev.m, d: ev.d, label: ev.label, note: ev.note,
      major: !!majorFlag, vis: ev.vis, pendingConfirm: true,
      locationEntryId: null, involvedIds: []
    });
  }
  // Propaga um evento (já com local/envolvidos definidos) pra todas as entradas relevantes:
  // local + envolvidos diretos (mesmo major/minor do original), e a cadeia inteira de locais-pai
  // do local escolhido (sempre minor, progressivo — local-mãe, local-avô, etc). Idempotente:
  // pode ser chamada de novo (ex: depois de adicionar mais um envolvido) sem duplicar o que já
  // foi propagado antes.
  function wbEventFamilyPropagate(originEntry, ev) {
    var targets = [];
    if (ev.locationEntryId) targets.push(ev.locationEntryId);
    (ev.involvedIds || []).forEach(function (id) { targets.push(id); });
    targets.forEach(function (tid) {
      if (tid === originEntry.id) return;
      var t = wbEntry(tid);
      if (t) wbPropagateEventCopy(t, ev, ev.major);
    });
    if (ev.locationEntryId) {
      var loc = wbEntry(ev.locationEntryId);
      var cur = loc && loc.parentId ? wbEntry(loc.parentId) : null, guard = 0;
      while (cur && guard++ < 12) {
        wbPropagateEventCopy(cur, ev, false);
        cur = cur.parentId ? wbEntry(cur.parentId) : null;
      }
    }
  }

  /* ---- Entry read ---- */
  function wbBreadcrumb(e) {
    var chain = [], cur = e, guard = 0;
    while (cur && guard++ < 12) { chain.unshift(cur); cur = cur.parentId ? wbEntry(cur.parentId) : null; }
    return chain;
  }
  // Each bucket holds {entry, link} pairs (not bare entries) so callers can honor the link's
  // own dispAs override — the same person can read "O Hóspede" on his own page but "Leonel
  // Bianchi" here, from his son's point of view.
  function wbFamily(e) {
    var parents = [], children = [], siblings = [], halfSiblings = [], spouses = [], grandparents = [], grandchildren = [];
    (e.links || []).forEach(function (lk) {
      var t = wbEntry(lk.to); if (!t) return;
      var pair = { entry: t, link: lk };
      if (lk.label === "é filho(a) de") parents.push(pair);
      else if (lk.label === "é pai/mãe de") children.push(pair);
      else if (lk.label === "irmão/irmã de") siblings.push(pair);
      else if (lk.label === "meio-irmão/meia-irmã de") halfSiblings.push(pair);
      else if (lk.label === "casado(a) com") spouses.push(pair);
      else if (lk.label === "avô/avó de") grandchildren.push(pair);
      else if (lk.label === "neto(a) de") grandparents.push(pair);
    });
    return { parents: parents, children: children, siblings: siblings, halfSiblings: halfSiblings, spouses: spouses, grandparents: grandparents, grandchildren: grandchildren };
  }
  // Two entries who share at least one "é filho(a) de" parent are siblings (full, if every parent
  // matches) or half-siblings (if only some do). Runs reactively whenever a parent link changes —
  // NOT on every load — so a manually-removed inferred link doesn't silently come back.
  function wbInferSiblings(childId) {
    var child = wbEntry(childId);
    if (!child) return;
    var parents = (child.links || []).filter(function (l) { return l.label === "é filho(a) de"; }).map(function (l) { return l.to; });
    if (!parents.length) return;
    C().entries.forEach(function (other) {
      if (other.id === child.id || other.universeId !== child.universeId) return;
      var otherParents = (other.links || []).filter(function (l) { return l.label === "é filho(a) de"; }).map(function (l) { return l.to; });
      if (!otherParents.length) return;
      var shared = parents.filter(function (p) { return otherParents.indexOf(p) !== -1; });
      if (!shared.length) return;
      var already = (child.links || []).some(function (l) { return l.to === other.id && (l.label === "irmão/irmã de" || l.label === "meio-irmão/meia-irmã de"); });
      if (already) return;
      var full = shared.length === parents.length && shared.length === otherParents.length;
      var label = full ? "irmão/irmã de" : "meio-irmão/meia-irmã de";
      child.links = child.links || []; child.links.push({ to: other.id, label: label, auto: true, dispAs: other.dispAlias || "" });
      other.links = other.links || []; other.links.push({ to: child.id, label: label, auto: true, dispAs: child.dispAlias || "" });
    });
  }
  // Same idea for grandparents: whoever is a parent of your parent is your avô/avó, and it works
  // both ways — a new parent link can turn that parent's OWN parents into grandparents of the
  // child, and can also turn that parent into a grandparent of the child's existing kids.
  function wbLinkPair(a, b, label, inv) {
    if (!(a.links || []).some(function (l) { return l.to === b.id && (l.label === label || l.label === inv); })) {
      a.links = a.links || []; a.links.push({ to: b.id, label: label, auto: true, dispAs: b.dispAlias || "" });
      b.links = b.links || []; b.links.push({ to: a.id, label: inv, auto: true, dispAs: a.dispAlias || "" });
    }
  }
  function wbInferGrandparents(childId) {
    var child = wbEntry(childId);
    if (!child) return;
    function parentsOf(en) { return (en.links || []).filter(function (l) { return l.label === "é filho(a) de"; }).map(function (l) { return wbEntry(l.to); }).filter(Boolean); }
    function childrenOf(en) { return C().entries.filter(function (x) { return x.universeId === en.universeId && (x.links || []).some(function (l) { return l.label === "é filho(a) de" && l.to === en.id; }); }); }
    var parents = parentsOf(child);
    parents.forEach(function (p) {
      parentsOf(p).forEach(function (gp) { if (gp.id !== child.id) wbLinkPair(child, gp, "neto(a) de", "avô/avó de"); });
    });
    childrenOf(child).forEach(function (kid) {
      parents.forEach(function (p) { if (p.id !== kid.id) wbLinkPair(kid, p, "neto(a) de", "avô/avó de"); });
    });
  }
  // Composes the rest of the family vocabulary from the same atomic facts (parent/child, irmão,
  // casado(a) com): tio/tia + sobrinho(a), primo(a), padrasto/madrasta + enteado(a), sogro/sogra +
  // genro/nora, cunhado(a). Only kinship/marriage relations are composed this way — they're
  // logically entailed by the atomic facts. Non-kinship links (aliado, amigo, chefe, faz parte
  // de…) are NOT auto-composed: those are facts about the world someone has to state, not
  // deductions. Reactive-only + additive-only, same rule as wbInferSiblings/wbInferGrandparents:
  // never runs on load, and removing an inferred link never cascades into removing another.
  function wbInferFamilyExtras(id) {
    var en = wbEntry(id);
    if (!en) return;
    function linksOf(x, labels) { return (x.links || []).filter(function (l) { return labels.indexOf(l.label) !== -1; }).map(function (l) { return wbEntry(l.to); }).filter(Boolean); }
    function parentsOf(x) { return linksOf(x, ["é filho(a) de"]); }
    function childrenOf(x) { return C().entries.filter(function (o) { return o.universeId === x.universeId && (o.links || []).some(function (l) { return l.label === "é filho(a) de" && l.to === x.id; }); }); }
    function siblingsOf(x) { return linksOf(x, ["irmão/irmã de", "meio-irmão/meia-irmã de"]); }
    function spousesOf(x) { return linksOf(x, ["casado(a) com"]); }
    function unclesOf(x) { return linksOf(x, ["tio/tia de"]); }
    function nephewsOf(x) { return linksOf(x, ["sobrinho(a) de"]); }

    var parents = parentsOf(en), sibs = siblingsOf(en), spouses = spousesOf(en);

    // tio/tia <-> sobrinho(a): my parents' siblings are my tios; my siblings' children are my sobrinhos.
    parents.forEach(function (p) {
      siblingsOf(p).forEach(function (tio) { if (tio.id !== en.id) wbLinkPair(en, tio, "sobrinho(a) de", "tio/tia de"); });
    });
    sibs.forEach(function (s) {
      childrenOf(en).forEach(function (sobrinho) { wbLinkPair(sobrinho, s, "sobrinho(a) de", "tio/tia de"); });
    });

    // primo(a): children of siblings, on both sides — and directly from a tio/sobrinho link even
    // if it was typed in by hand instead of derived from parent+irmão facts.
    sibs.forEach(function (s) {
      childrenOf(s).forEach(function (primo) { childrenOf(en).forEach(function (meu) { if (meu.id !== primo.id) wbLinkPair(meu, primo, "primo(a) de", "primo(a) de"); }); });
    });
    unclesOf(en).forEach(function (tio) {
      childrenOf(tio).forEach(function (primo) { if (primo.id !== en.id) wbLinkPair(en, primo, "primo(a) de", "primo(a) de"); });
    });
    nephewsOf(en).forEach(function (sobrinho) {
      childrenOf(en).forEach(function (primo) { if (primo.id !== sobrinho.id) wbLinkPair(sobrinho, primo, "primo(a) de", "primo(a) de"); });
    });

    // casado(a) com composes into padrasto/madrasta, sogro/sogra e cunhado(a).
    spouses.forEach(function (sp) {

  // Genealogia visual: agora 5 gerações (avós/pais/EU+irmãos+cônjuge/filhos/netos), não só
  // pais+filhos. Avós/netos ficam tracejados (mesma convenção visual do mapa pra "relação mais
  // distante"); irmãos/meio-irmãos ficam à esquerda do próprio nó e cônjuge(s) à direita, sem
  // empurrar a árvore pra um layout de organograma completo (que exigiria saber qual avô é pai
  // de qual pai — dado que a árvore não guarda essa associação, só a lista achatada).
  function wbFamilyTree(e, fam) {
    var sibs = fam.siblings.concat(fam.halfSiblings);
    var hasAny = fam.parents.length || fam.children.length || fam.grandparents.length || fam.grandchildren.length || sibs.length || fam.spouses.length;
    if (!hasAny) return el("span");
    var selfRowN = 1 + sibs.length + fam.spouses.length;
    var maxRowN = Math.max(fam.grandparents.length, fam.parents.length, selfRowN, fam.children.length, fam.grandchildren.length, 1);
    var W = Math.max(460, maxRowN * 92), cx = W / 2;
    var GP_Y = 20, P_Y = 82, SELF_Y = 144, C_Y = 206, GC_Y = 264, H = 284;
    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, class: "wb-famtree", width: "100%" });
    function nodeAt(x, y, label, ent, self) {
      var g = svgEl("g", { transform: "translate(" + x + "," + y + ")" });
      g.style.cursor = ent && !self ? "pointer" : "default";
      var w2 = Math.max(60, label.length * 6.4 + 14);
      g.appendChild(svgEl("rect", { x: -w2 / 2, y: -13, width: w2, height: 26, rx: 7, fill: self ? "var(--accent-wash)" : "var(--surface)", stroke: self ? "var(--accent)" : "var(--border-strong)" }));
      var t = svgEl("text", { class: "wb-ft-label", y: 4 }); t.textContent = label.length > 16 ? label.slice(0, 15) + "…" : label;
      g.appendChild(t);
      if (ent && !self) g.addEventListener("click", function () { wbOpen(ent); });
      return g;
    }
    function rowXs(n) {
      if (n <= 0) return [];
      if (n === 1) return [cx];
      var span = Math.min(W * 0.86, (n - 1) * 92);
      var x0 = cx - span / 2;
      return Array.from({ length: n }, function (_, i) { return x0 + i * (span / (n - 1)); });
    }
    function tier(pairs, y, lineFromY, toX, toY, dashed) {
      var xs = rowXs(pairs.length);
      pairs.forEach(function (pair, i) {
        var attrs = { x1: xs[i], y1: lineFromY, x2: toX, y2: toY, stroke: "var(--border-strong)" };
        if (dashed) attrs["stroke-dasharray"] = "2 3";
        svg.appendChild(svgEl("line", attrs));
        svg.appendChild(nodeAt(xs[i], y, wbDisplayName(pair.entry, pair.link.dispAs), pair.entry));
      });
    }
    tier(fam.grandparents, GP_Y, GP_Y + 13, cx, P_Y - 13, true);
    tier(fam.parents, P_Y, P_Y + 13, cx, SELF_Y - 13, false);
    var GAP = 78;
    sibs.forEach(function (pair, i) {
      var x = cx - GAP * (sibs.length - i);
      svg.appendChild(svgEl("line", { x1: x, y1: SELF_Y, x2: cx - 26, y2: SELF_Y, stroke: "var(--border-strong)" }));
      svg.appendChild(nodeAt(x, SELF_Y, wbDisplayName(pair.entry, pair.link.dispAs), pair.entry));
    });
    svg.appendChild(nodeAt(cx, SELF_Y, e.title, e, true));
    fam.spouses.forEach(function (pair, i) {
      var x = cx + GAP * (i + 1);
      svg.appendChild(svgEl("line", { x1: cx + 26, y1: SELF_Y, x2: x, y2: SELF_Y, stroke: "var(--border-strong)", "stroke-dasharray": "2 3" }));
      svg.appendChild(nodeAt(x, SELF_Y, wbDisplayName(pair.entry, pair.link.dispAs), pair.entry));
    });
    tier(fam.children, C_Y, C_Y - 13, cx, SELF_Y + 13, false);
    tier(fam.grandchildren, GC_Y, GC_Y - 13, cx, C_Y + 13, true);

  // Grafo de relações da própria entrada: topologia em estrela (e no centro, um nó por ligação

  // desenha tudo de uma vez) — aqui é só o que toca ESTA entrada, ligações de saída (e.links) E
  // de entrada (outras entradas que apontam pra ela, já que um label digitado à mão sem par no

  // sem uma de saída correspondente). Uma entrada de outro universo entra como nó próprio (cor

  function wbEntryRelGraph(e) {

    });
    C().entries.forEach(function (other) {
      if (other.id === e.id || neighbors[other.id]) return;
      (other.links || []).forEach(function (lk) {
        if (lk.to === e.id && !neighbors[other.id]) neighbors[other.id] = { ent: other, label: lk.label || "", style: linkStyleOf(lk.label) };
      });
    });
    var ids = Object.keys(neighbors);

    var nodes = [{ id: e.id, label: wbDisplayName(e), color: typeColor(e.type), r: 19, kind: "entry", x: null, y: null }];
    var edges = [];

      edges.push({ from: e.id, to: id, label: n.label, style: n.style });
    });

        onDblCanvas: function () {}, persist: function () {}
      });
    }, 0);
    return host;
  }

          if (ev.clientY < rect.top + rect.height / 2) { listEl.insertBefore(dragEl, r); placed = true; break; }
        }

        if (!dragEl) return;

        var newIdx = rows().indexOf(dragEl);
        dragEl = null;
        if (newIdx !== -1 && newIdx !== dragIdx) {
          var item = arr.splice(dragIdx, 1)[0];
          arr.splice(newIdx, 0, item);

  }

  /* ---- Force-directed graph engine ---- */
  function createGraph(host, cfg) {
    host.innerHTML = "";
    var W = host.clientWidth || 620, H = host.classList.contains("tall") ? 520 : host.classList.contains("compact") ? 240 : 430;
    var svg = svgEl("svg", { class: "wb-graph", width: "100%", height: H, viewBox: "0 0 " + W + " " + H });
    var g = svgEl("g");
    svg.appendChild(g);
    host.appendChild(svg);
    var controls = el("div", { class: "wb-graph-ctrl" }, [
      el("button", { type: "button", "aria-label": "Aproximar", text: "+", onclick: function () { zoomBy(1.2); } }),
      el("button", { type: "button", "aria-label": "Afastar", text: "−", onclick: function () { zoomBy(1 / 1.2); } }),
      el("button", { type: "button", "aria-label": "Centralizar", html: "&#8982;", onclick: function () { pan.x = 0; pan.y = 0; k = 1; applyTransform(); } }),
      el("button", { type: "button", "aria-label": "Reorganizar", html: "&#8635;", onclick: function () { nodes.forEach(function (n) { if (!n.fixed) { n.x = (Math.random() - 0.5) * 200; n.y = (Math.random() - 0.5) * 200; } }); kick(); } })
    ]);
    host.appendChild(controls);
    if (cfg.legend && Object.keys(cfg.legend).length) {
      var lg = el("div", { class: "wb-legend" });
      Object.keys(cfg.legend).slice(0, 8).forEach(function (name) {
        lg.appendChild(el("span", { class: "wb-lg-item" }, [el("span", { class: "wb-lg-dot", style: "background:" + cfg.legend[name] }), el("span", { text: name })]));
      });
      host.appendChild(lg);
    }

    var pan = { x: 0, y: 0 }, k = 1;
    var nodes = cfg.nodes.map(function (n) { return Object.assign({ vx: 0, vy: 0 }, n, { x: n.x != null ? n.x : (Math.random() - 0.5) * 220, y: n.y != null ? n.y : (Math.random() - 0.5) * 220 }); });
    var byId = {}; nodes.forEach(function (n) { byId[n.id] = n; });
    var edges = cfg.edges.filter(function (e) { return byId[e.from] && byId[e.to]; });
    var reduced = reducedMotion();
    var raf = null, drag = null, panning = null, downPt = null, moved = false;
    var focusId = cfg.focusId || null;
    var neighborSet = {};
    if (focusId && byId[focusId]) { neighborSet[focusId] = 1; edges.forEach(function (e) { if (e.from === focusId) neighborSet[e.to] = 1; if (e.to === focusId) neighborSet[e.from] = 1; }); }
    // Jump straight to a searched-for node instead of making the user hunt for the one
    // undimmed dot in a crowded graph — only meaningful on first paint, not chased every tick.
    if (cfg.centerOn && byId[cfg.centerOn]) { pan.x = -byId[cfg.centerOn].x * k; pan.y = -byId[cfg.centerOn].y * k; }

    function applyTransform() { g.setAttribute("transform", "translate(" + (W / 2 + pan.x) + "," + (H / 2 + pan.y) + ") scale(" + k + ")"); }
    applyTransform();

    var edgeEls = edges.map(function (e) {
      var st = EDGE_STYLE[e.style] || EDGE_STYLE.neutral;
      var line = svgEl("line", { class: "wb-edge" + (e.weak ? " weak" : ""), stroke: e.weak ? "var(--border-strong)" : st.color, "stroke-dasharray": st.dash || (e.weak ? "2 4" : "") });
      g.appendChild(line);
      var lbl = null;
      if (e.label) { lbl = svgEl("text", { class: "wb-edge-label" }); lbl.textContent = e.label; g.appendChild(lbl); }
      return { e: e, line: line, lbl: lbl };
    });
    var nodeEls = nodes.map(function (n) {
      var ng = svgEl("g", { class: "wb-node wb-node--" + n.kind, tabindex: "0" });
      ng.appendChild(svgEl("circle", { r: n.r, fill: n.color }));
      if (n.kind === "portal") ng.appendChild(svgEl("circle", { r: n.r - 5, fill: "var(--surface)", opacity: "0.4" }));
      var t = svgEl("text", { class: "wb-node-label", y: n.r + 13 });
      t.textContent = n.label.length > 22 ? n.label.slice(0, 21) + "…" : n.label;
      ng.appendChild(t);
      g.appendChild(ng);
      ng.addEventListener("pointerdown", function (ev) { ev.stopPropagation(); startDragNode(n, ev); });
      ng.addEventListener("keydown", function (ev) { if (ev.key === "Enter") cfg.onNode(n.id); });
      return { n: n, g: ng };
    });

    function screenToWorld(ev) { var r = svg.getBoundingClientRect(); return { x: (ev.clientX - r.left - W / 2 - pan.x) / k, y: (ev.clientY - r.top - H / 2 - pan.y) / k }; }
    function startDragNode(n, ev) { drag = n; downPt = { x: ev.clientX, y: ev.clientY }; moved = false; try { svg.setPointerCapture(ev.pointerId); } catch (e) {} kick(); }
    svg.addEventListener("pointerdown", function (ev) { panning = { x: ev.clientX, y: ev.clientY, px: pan.x, py: pan.y }; downPt = { x: ev.clientX, y: ev.clientY }; moved = false; try { svg.setPointerCapture(ev.pointerId); } catch (e) {} });
    svg.addEventListener("pointermove", function (ev) {
      if (downPt && (Math.abs(ev.clientX - downPt.x) + Math.abs(ev.clientY - downPt.y) > 4)) moved = true;
      if (drag) { var p = screenToWorld(ev); drag.x = p.x; drag.y = p.y; drag.vx = drag.vy = 0; kick(); }
      else if (panning) { pan.x = panning.px + (ev.clientX - panning.x); pan.y = panning.py + (ev.clientY - panning.y); applyTransform(); }
    });
    svg.addEventListener("pointerup", function () {
      if (drag && !moved) { if (cfg.onNode) cfg.onNode(drag.id); }
      else if (panning && !moved && cfg.clearFocus) cfg.clearFocus();
      if (drag) { drag = null; if (cfg.persist) persistPositions(); }
      panning = null; downPt = null;
    });
    svg.addEventListener("pointercancel", function () { drag = null; panning = null; downPt = null; });
    svg.addEventListener("dblclick", function (ev) { if (moved) return; if (cfg.onDblCanvas) cfg.onDblCanvas(screenToWorld(ev)); });
    svg.addEventListener("wheel", function (ev) {
      ev.preventDefault();
      var r = svg.getBoundingClientRect();
      var mx = ev.clientX - r.left, my = ev.clientY - r.top;
      var wx = (mx - W / 2 - pan.x) / k, wy = (my - H / 2 - pan.y) / k;
      k = clampN(k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12), 0.4, 2.4);
      pan.x = mx - W / 2 - wx * k; pan.y = my - H / 2 - wy * k;
      applyTransform();
    }, { passive: false });
    function zoomBy(factor) { k = clampN(k * factor, 0.4, 2.4); applyTransform(); }

    function persistPositions() {
      if (host._destroyed || !svg.isConnected) return;
      nodes.forEach(function (n) { if (n.ref) { n.ref.x = Math.round(n.x); n.ref.y = Math.round(n.y); } });
      cfg.persist && cfg.persist();
    }
    function tick() {
      raf = null;
      var krep = 6400, kspring = 0.05, klen = 112, kcen = 0.008, damp = 0.85, maxv = 16;
      var i, j, a, b, dx, dy, d2, d, ux, uy, fv;
      for (i = 0; i < nodes.length; i++) {
        a = nodes[i];
        for (j = i + 1; j < nodes.length; j++) {
          b = nodes[j];
          dx = a.x - b.x; dy = a.y - b.y; d2 = dx * dx + dy * dy + 0.01; d = Math.sqrt(d2);
          fv = Math.min(krep / d2, 4); ux = dx / d; uy = dy / d;
          a.vx += ux * fv; a.vy += uy * fv; b.vx -= ux * fv; b.vy -= uy * fv;
        }
      }
      edges.forEach(function (e) {
        a = byId[e.from]; b = byId[e.to];
        dx = b.x - a.x; dy = b.y - a.y; d = Math.sqrt(dx * dx + dy * dy) + 0.01;
        fv = kspring * (d - klen); ux = dx / d; uy = dy / d;
        a.vx += ux * fv; a.vy += uy * fv; b.vx -= ux * fv; b.vy -= uy * fv;
      });
      var energy = 0;
      nodes.forEach(function (n) {
        if (n.fixed || n === drag) { n.vx = n.vy = 0; return; }
        n.vx += (0 - n.x) * kcen; n.vy += (0 - n.y) * kcen;
        if (n.hub && cfg.hubGravity) { n.vx += (n.hub.x - n.x) * cfg.hubGravity; n.vy += (n.hub.y - n.y) * cfg.hubGravity; }
        n.vx *= damp; n.vy *= damp;
        n.vx = clampN(n.vx, -maxv, maxv); n.vy = clampN(n.vy, -maxv, maxv);
        n.x += n.vx; n.y += n.vy;
        energy += n.vx * n.vx + n.vy * n.vy;
      });
      if (host._destroyed || !svg.isConnected) return;
      draw();
      if (energy > 0.5 || drag) raf = requestAnimationFrame(tick);
      else persistPositions();
    }
    function draw() {
      edgeEls.forEach(function (ee) {
        var a = byId[ee.e.from], b = byId[ee.e.to];
        ee.line.setAttribute("x1", a.x); ee.line.setAttribute("y1", a.y);
        ee.line.setAttribute("x2", b.x); ee.line.setAttribute("y2", b.y);
        var dim = focusId && !(neighborSet[ee.e.from] && neighborSet[ee.e.to]);
        ee.line.style.opacity = dim ? 0.08 : "";
        if (ee.lbl) { ee.lbl.setAttribute("x", (a.x + b.x) / 2); ee.lbl.setAttribute("y", (a.y + b.y) / 2 - 3); ee.lbl.style.opacity = dim ? 0.08 : ""; }
      });
      nodeEls.forEach(function (ne) {
        ne.g.setAttribute("transform", "translate(" + ne.n.x.toFixed(1) + "," + ne.n.y.toFixed(1) + ")");
        ne.g.style.opacity = (focusId && !neighborSet[ne.n.id]) ? 0.14 : "";
      });
    }
    function kick() { if (!raf && !host._destroyed && svg.isConnected) { if (reduced) { draw(); persistPositions(); return; } raf = requestAnimationFrame(tick); } }
    draw();
    if (reduced) persistPositions(); else kick();
    host._destroyed = false;
    return { destroy: function () { host._destroyed = true; if (raf) cancelAnimationFrame(raf); } };
  }

  /* ---- Image upload (downscale client-side, store in Firebase Storage) ---- */
  function downscaleImage(file, maxDim, quality, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height, scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
        cv.getContext("2d").drawImage(img, 0, 0, cw, ch);
        cv.toBlob(function (blob) { cb(blob || file); }, "image/jpeg", quality);
      };
      img.onerror = function () { cb(file); };
      img.src = reader.result;
    };
    reader.onerror = function () { cb(file); };
    reader.readAsDataURL(file);
  }
  function uploadImage(file, onDone, onProgress) {
    if (!file) return;
    if (!fbStorage || !fbUser) { alert("Entre na sua conta para enviar imagens (menu ⋯ › sincronização)."); return; }
    if (!/^image\//.test(file.type)) { alert("Selecione um arquivo de imagem."); return; }
    downscaleImage(file, 1600, 0.82, function (blob) {
      var ref = fbStorage.ref("world-images/" + uid() + ".jpg");
      var task = ref.put(blob, { contentType: "image/jpeg" });
      task.on("state_changed",
        function (s) { if (onProgress) onProgress(s.totalBytes ? s.bytesTransferred / s.totalBytes : 0); },
        function (err) { alert("Falha ao enviar a imagem: " + (err && err.code ? err.code : err)); if (onProgress) onProgress(-1); },
        function () { ref.getDownloadURL().then(function (url) { onDone(url); }).catch(function () { alert("Imagem enviada, mas não consegui o link."); }); }
      );
    });
  }
  function pickImage(onUrl) {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*"; inp.style.display = "none";
    // Alguns navegadores móveis são inconsistentes com .click() num <input> que nunca esteve no
    // documento — anexa temporariamente (removido assim que o valor muda) em vez de deixá-lo solto.
    document.body.appendChild(inp);
    inp.onchange = function () { if (inp.files && inp.files[0]) uploadImage(inp.files[0], onUrl); inp.remove(); };
    inp.addEventListener("cancel", function () { inp.remove(); });
    inp.click();
  }

      box.appendChild(el("button", { class: "mini-btn", type: "button", text: "Entrar / criar conta", onclick: function () { root.innerHTML = ""; openAuthModal(); } }));
    }

    box.appendChild(el("div", { class: "section-label", style: "margin-top:14px", text: "Jogadores da wiki" }));
    box.appendChild(el("div", { class: "hint", style: "margin:-4px 0 8px", text: "Quem pode ver conteúdo marcado \"🔐 restrito\", e em quais universos (fora o Lótus, que é público a todos)." }));
    (state.wikiPlayers || []).forEach(function (p) {
      var uniRow = el("div", { class: "note-tags", style: "margin:4px 0 8px" });
      FLOWERS.filter(function (f) { return f.id !== "lotus"; }).forEach(function (f) {
        var on = (p.universes || []).indexOf(f.id) !== -1;
        uniRow.appendChild(el("button", {
          type: "button", class: "chip sm", "aria-pressed": on ? "true" : "false",
          onclick: function () {
            p.universes = p.universes || [];
            var i = p.universes.indexOf(f.id);
            if (i === -1) p.universes.push(f.id); else p.universes.splice(i, 1);
            save(); wbSyncUniverseAccess(); root.innerHTML = ""; document.getElementById("menuBtn").click();
          }
        }, [el("span", { text: (on ? "✓ " : "") + f.name })]));
      });
      box.appendChild(el("div", { class: "row" }, [
        el("div", { class: "row-body" }, [el("div", { class: "row-title", text: p.label || p.email }), el("div", { class: "row-meta", text: p.email }), uniRow]),
        delBtn(function () {
          state.wikiPlayers = state.wikiPlayers.filter(function (x) { return x.email !== p.email; });
          save(); wbSyncUniverseAccess(); root.innerHTML = ""; document.getElementById("menuBtn").click();
        })
      ]));
    });
    var addErr = el("div", { style: "color:var(--neg);font-size:12px;min-height:16px;margin-top:4px" });
    var addForm = el("form", { class: "inline", style: "margin-top:6px", onsubmit: function (ev) {
      ev.preventDefault();
      addErr.textContent = "";
      var email = (addForm.querySelector("[name=email]").value || "").trim().toLowerCase();
      var label = (addForm.querySelector("[name=label]").value || "").trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { addErr.textContent = "Email inválido."; return; }
      if ((state.wikiPlayers || []).some(function (p) { return p.email === email; })) { addErr.textContent = "Esse email já está na lista."; return; }
      var submitBtn = addForm.querySelector("[type=submit]");
      submitBtn.disabled = true; submitBtn.textContent = "convidando…";
      wbInvitePlayer(email, function (err) {
        submitBtn.disabled = false; submitBtn.textContent = "+ convidar";
        if (err) { addErr.textContent = "Não consegui criar o convite: " + (err.message || err); return; }
        state.wikiPlayers = (state.wikiPlayers || []).concat([{ email: email, label: label, addedAt: todayKey() }]);
        save(); root.innerHTML = ""; document.getElementById("menuBtn").click();
      });
    } });
    addForm.appendChild(el("input", { class: "field", name: "label", placeholder: "nome/apelido (opcional)", style: "width:40%" }));
    addForm.appendChild(el("input", { class: "field grow", name: "email", type: "email", placeholder: "email do jogador" }));
    addForm.appendChild(el("button", { class: "btn ghost sm", type: "submit", text: "+ convidar" }));
    box.appendChild(addForm);
    box.appendChild(addErr);
    box.appendChild(el("div", { class: "hint", style: "margin:-2px 0 0", text: "Cria a conta do jogador e manda um email pra ele escolher a própria senha. Você nunca vê nem passa senha nenhuma." }));
    box.appendChild(el("button", { class: "mini-btn", type: "button", style: "margin-top:8px", text: "📋 painel de publicação", onclick: function () { root.innerHTML = ""; wbGo({ view: "wikipanel" }); } }));

    box.appendChild(el("div", { class: "section-label", style: "margin-top:14px", text: "Aparência" }));
    var sw = el("div", { class: "accent-swatches" });
    Object.keys(ACCENTS).forEach(function (key) {
      sw.appendChild(el("button", { class: "accent-sw" + (state.settings.accent === key ? " on" : ""), type: "button", "aria-label": key, style: "background:" + ACCENTS[key].a, onclick: function () { state.settings.accent = key; applyAccent(); save(); root.innerHTML = ""; document.getElementById("menuBtn").click(); } }));
    });
    box.appendChild(sw);
    box.appendChild(el("button", { class: "mini-btn", type: "button", style: "margin-top:8px", text: (document.getElementById("themeLabel").textContent || "Alternar tema"), onclick: function () { themeBtn.click(); root.innerHTML = ""; } }));

    box.appendChild(el("div", { class: "section-label", style: "margin-top:14px", text: "Dados" }));
    var qpct = Math.round(_stateBytes / QUOTA_MAX * 100);
    box.appendChild(el("div", { class: "row-meta", style: "margin-bottom:6px", text: "Tamanho: " + fmtBytes(_stateBytes) + " de ~1 MB (" + qpct + "%)" }));
    box.appendChild(el("div", { class: "bar-track", style: "margin:0 0 10px" }, [
      el("div", { class: "bar-fill" + (_stateBytes >= QUOTA_HARD ? " neg" : _stateBytes >= QUOTA_SOFT ? " warn" : ""), style: "width:" + Math.min(100, qpct) + "%" })
    ]));
    box.appendChild(el("button", { class: "mini-btn", type: "button", text: "Backup / apagar dados", onclick: function () { root.innerHTML = ""; document.getElementById("exportBtn").click(); } }));

    box.appendChild(el("div", { class: "modal-actions" }, [el("button", { class: "btn", type: "button", text: "Fechar", onclick: function () { root.innerHTML = ""; } })]));
    m.appendChild(box);
    root.innerHTML = "";
    root.appendChild(m);
    paintSync();
  });

  render();
  paintSync();
  initCloud();
})();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("../sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
